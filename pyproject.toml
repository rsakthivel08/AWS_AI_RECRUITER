[project]
name = "ai-recruiter-aws"
version = "1.0.0"
description = "Serverless AI recruiter on AWS (Free-plan profile)"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35",
  "pydantic>=2.9",
  "pymupdf>=1.24",
  "docx2txt>=0.8",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-mock>=3",
  "moto[dynamodb]>=5.1",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
no_strict_optional = true
exclude = ["tests", "infra", "web"]
