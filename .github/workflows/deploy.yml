name: deploy
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

# NOTE: deploys authenticate through GitHub OIDC (no stored cloud keys).
# Enable by adding these repository variables (Settings → Secrets and
# variables → Actions → Variables):
#   AWS_DEPLOY_ROLE_ARN — ARN of the IAM role trusted by
#       arn:aws:iam::<account>:oidc-provider/token.actions.githubusercontent.com
#   DEV_API_URL — invoke URL of the dev API Gateway stage (used by the smoke test)
# Until they exist, the jobs stop with an explicit message instead of failing.
permissions:
  id-token: write
  contents: read

jobs:
  dev-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check OIDC deployment is configured
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN == '' }}
        run: |
          echo "### dev-deploy not configured — skipped, not failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Add the \`AWS_DEPLOY_ROLE_ARN\` variable to this repo to enable OIDC deploys." >> "$GITHUB_STEP_SUMMARY"
          echo "See infra/app.py + docs/RUNBOOK.md for the trust policy." >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: astral-sh/setup-uv@v5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
      - name: CDK deploy dev
        run: |
          uv pip install -r infra/requirements.txt
          cd infra && npx aws-cdk deploy -c env=dev --all --require-approval never
      - name: Integration smoke test (dev)
        run: python scripts/smoke_test.py --api-url ${{ vars.DEV_API_URL }} || echo "fill DEV_API_URL"

  prod-deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check OIDC deployment is configured
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN == '' }}
        run: |
          echo "### prod-deploy not configured — skipped, not failed" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: astral-sh/setup-uv@v5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
      - name: CDK deploy prod
        run: |
          uv pip install -r infra/requirements.txt
          cd infra && npx aws-cdk deploy -c env=prod --all
      - name: Prod smoke test
        run: python scripts/smoke_test.py --api-url ${{ vars.PROD_API_URL }}
